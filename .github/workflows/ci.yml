name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        run: gotestsum --format short-verbose --packages="./..." --junitfile unit.xml -- -short -race -coverprofile=coverage.out -timeout=30m ./...

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-go${{ matrix.go-version }}
          path: |
            coverage.out
            unit.xml
          if-no-files-found: error

      - name: Coverage Report
        if: matrix.go-version == '1.26'
        run: |
          echo "### Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Check validator markers
        run: make check-validator-markers

      - name: Check NOTICE version alignment
        run: make check-notice-version

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --config=.golangci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Verify SIMD build isolation
        run: make simd-isolation-check

      - name: Build
        run: make build

  simd:
    name: SIMD (${{ matrix.goos }}/${{ matrix.goarch }}, ${{ matrix.tier }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.advisory }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tier: required
            advisory: false
            race: true
            release: linux-amd64
            library: libpure_simdjson.so
          - runner: macos-15
            goos: darwin
            goarch: arm64
            tier: required
            advisory: false
            race: true
            release: darwin-arm64
            library: libpure_simdjson.dylib
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            tier: advisory
            advisory: true
            race: false
            release: linux-arm64
            library: libpure_simdjson.so
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            tier: advisory
            advisory: true
            race: false
            release: darwin-amd64
            library: libpure_simdjson.dylib
          - runner: windows-latest
            goos: windows
            goarch: amd64
            tier: advisory
            advisory: true
            race: false
            release: windows-amd64-msvc
            library: pure_simdjson-msvc.dll
    env:
      AMI_GIN_SIMD_REQUIRED: "1"
      PURE_SIMDJSON_CACHE_DIR: ${{ runner.temp }}/pure-simdjson
      PURE_SIMDJSON_WARN_LEAKS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Resolve effective SIMD version
        id: simd-version
        run: |
          pure_simdjson_version="$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' github.com/amikos-tech/pure-simdjson)"
          printf 'version=%s\n' "$pure_simdjson_version" >> "$GITHUB_OUTPUT"

      - name: Restore native SIMD library
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pure-simdjson
          key: pure-simdjson-${{ runner.os }}-${{ runner.arch }}-${{ steps.simd-version.outputs.version }}

      - name: Install verified native SIMD library
        env:
          PURE_SIMDJSON_BINARY_MIRROR: https://github.com/amikos-tech/pure-simdjson/releases/download
        run: go run "github.com/amikos-tech/pure-simdjson/cmd/pure-simdjson-bootstrap@${{ steps.simd-version.outputs.version }}" fetch

      - name: Run SIMD-tagged tests
        run: |
          race_flags=()
          if [[ "${{ matrix.race }}" == "true" ]]; then
            race_flags=(-race)
          fi
          go test -tags simdjson "${race_flags[@]}" -timeout=30m ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"
          go-package: ./...
          repo-checkout: false
          output-format: text
